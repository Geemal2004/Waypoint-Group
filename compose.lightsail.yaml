# Competition instance: persistent judge data and HTTPS at the edge.
services:
  db:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the private cloud database password}
    mem_limit: 768m
  redis:
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy noeviction
    mem_limit: 128m
  planning:
    restart: unless-stopped
    ports: !override []
    mem_limit: 384m
  core:
    restart: unless-stopped
    ports: !override []
    environment:
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set the private cloud database password}
      DEMO_SEED: "true"
      SESSION_SECURE: "true"
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m -XX:MaxMetaspaceSize=192m
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    mem_limit: 896m
  web:
    build:
      args:
        VITE_SHOW_DEMO_PASSWORD: "false"
    restart: unless-stopped
    ports: !override []
    volumes:
      - ./deploy/lightsail/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 128m
  osrm:
    restart: unless-stopped
    ports: !override []
    mem_limit: 1024m
  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      WAYPOINT_HOST: ${WAYPOINT_HOST:?Set the public HTTPS hostname}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/lightsail/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m
    depends_on:
      web:
        condition: service_healthy
volumes:
  caddy-data:
  caddy-config:
