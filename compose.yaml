name: waypoint
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-waypoint}
      POSTGRES_USER: ${POSTGRES_USER:-waypoint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waypoint_local_only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  planning:
    build: ./services/planning
    ports:
      - '127.0.0.1:${PLANNING_PORT:-8000}:8000'
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  core:
    build: ./services/core
    volumes:
      - ./data/private:/seed:ro
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-waypoint}
      DB_USER: ${POSTGRES_USER:-waypoint}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-waypoint_local_only}
      REDIS_HOST: redis
      PLANNING_URL: http://planning:8000
      OSRM_URL: http://osrm:5000
      FRESH_ONLY_REEFERS: ${FRESH_ONLY_REEFERS:-true}
      TURNAROUND_MINUTES: ${TURNAROUND_MINUTES:-30}
      DEMO_SEED: ${DEMO_SEED:-true}
      SESSION_SECURE: ${SESSION_SECURE:-false}
    ports:
      - '127.0.0.1:${CORE_PORT:-8081}:8081'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      planning:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8081/actuator/health/readiness]
      interval: 10s
      timeout: 5s
      retries: 30
  web:
    build: ./apps/web
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:80'
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/]
      interval: 10s
      timeout: 3s
      retries: 10
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: [routing]
    ports:
      - '127.0.0.1:${OSRM_PORT:-5000}:5000'
    volumes:
      - ./data/osrm:/data:ro
    command: osrm-routed --algorithm mld /data/sri-lanka.osrm
volumes:
  postgres-data:
