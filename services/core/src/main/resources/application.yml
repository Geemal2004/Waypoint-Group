server:
  port: 8081
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${SESSION_SECURE:false}
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/waypoint}
    username: ${DB_USER:waypoint}
    password: ${DB_PASSWORD:waypoint_local_only}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
  flyway:
    enabled: true
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
  endpoints:
    web:
      exposure:
        include: health
waypoint:
  osrm-url: ${OSRM_URL:http://localhost:5000}
  fresh-only-reefers: ${FRESH_ONLY_REEFERS:true}
  turnaround-minutes: ${TURNAROUND_MINUTES:30}
  planning-url: ${PLANNING_URL:http://localhost:8000}
  demo-seed: ${DEMO_SEED:false}
  network-import: ${NETWORK_IMPORT:/seed/shared-network.sql}
  planning-import: ${PLANNING_IMPORT:/seed/planning-scenario.sql}
