name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci && npm run build
        working-directory: apps/web
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify -Pintegration
        working-directory: services/core
  planning:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt && python -m pytest
        working-directory: services/planning
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: docker compose up --build -d --wait
      - name: Verify authenticated API handoffs and replay recovery
        run: node tools/online-walkthrough.mjs
      - run: npm run test:e2e
        working-directory: apps/web
        env:
          PUBLIC_CI_FIXTURES: 'true'
      - name: Capture service diagnostics
        if: failure()
        run: mkdir -p tmp && docker compose logs --no-color > tmp/ci-compose.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: |
            tmp/browser-results
            tmp/ci-compose.log
      - run: docker compose down
        if: always()
  deploy:
    name: Deploy competition
    needs: [web, core, planning, browser]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: competition
      url: https://18-138-29-235.sslip.io
    concurrency:
      group: lightsail-competition
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package committed source only
        shell: pwsh
        run: ./tools/package-release.ps1 -Revision $env:GITHUB_SHA
      - name: Deploy verified release
        env:
          LIGHTSAIL_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          LIGHTSAIL_HOST: ${{ secrets.SERVER_HOST }}
          LIGHTSAIL_USER: ${{ secrets.SERVER_USER }}
        run: bash deploy/lightsail/github-deploy.sh
