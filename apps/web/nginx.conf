server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 15m;
  location /api/ {
    proxy_pass http://core:8081;
    proxy_set_header Host $host;
  }
  location / { try_files $uri $uri/ /index.html; }
  location = /sw.js { add_header Cache-Control "no-cache"; }
}
