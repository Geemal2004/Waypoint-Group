server {
  listen 443 ssl;
  ssl_certificate /run/waypoint-tls/fullchain.pem;
  ssl_certificate_key /run/waypoint-tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 15m;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
  location /api/ {
    proxy_pass http://core:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 65s;
    proxy_hide_header Cache-Control;
    add_header Cache-Control no-store always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
  }
  location / { try_files $uri $uri/ /index.html; }
  location = /sw.js { expires -1; }
}
